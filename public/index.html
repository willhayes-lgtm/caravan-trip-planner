<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caravan Trip Planner · 2027</title><link rel="stylesheet" href="/style.css"></head><body><header><div><span class="eyebrow">THE HAYES FAMILY</span><h1>🚐 Caravan Trip Planner</h1><p>2027 holidays, bookings & budgets in one place.</p></div><button class="secondary" id="logout">Sign out</button></header><main><section class="stats" id="stats"></section><section class="toolbar"><h2>Our adventures</h2><div class="actions"><button class="secondary" id="export">Export backup</button><button class="secondary" id="import">Import changes</button><input type="file" id="file" accept="application/json,.json" hidden><button id="add">+ Add trip</button></div></section><div id="notice" role="status"></div><section id="trips" class="cards"></section><p class="footnote">All prices in GBP. Nights are calculated from arrival to departure. Data is stored privately in Cloudflare D1.</p></main><dialog id="editor"><form id="tripForm"><h2 id="formTitle">Edit trip</h2><input name="id" type="hidden"><div class="formgrid"><label>Trip name<input name="title" required maxlength="160"></label><label>Location / campsite<input name="location" maxlength="200"></label><label>Arrival<input name="start_date" type="date" required></label><label>Departure<input name="end_date" type="date" required></label><label>Accommodation / travel bookings (£)<input name="cost" type="number" min="0" step="0.01" value="0"></label><label>Already paid (£)<input name="paid" type="number" min="0" step="0.01" value="0"></label><label>Estimated diesel (£)<input name="diesel" type="number" min="0" step="0.01" value="0"></label><label>Annual leave (days)<input name="leave_days" type="number" min="0" step="0.5" value="0"></label><label>Status<select name="status"><option value="planned">Planned</option><option value="booked">Booked</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label><label>Balance due date<input name="due_date" type="date"></label><label>Booking reference<input name="booking_ref" maxlength="200"></label><label class="wide">Notes<textarea name="notes" rows="4" maxlength="4000"></textarea></label></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button>Save trip</button></div></form></dialog><script src="/app.js" defer></script></body></html>
