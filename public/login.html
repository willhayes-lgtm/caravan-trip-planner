<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Caravan Planner</title><link rel="stylesheet" href="/style.css"></head><body><main class="login panel"><h1>🚐 Caravan Planner</h1><p>Sign in to see your private family holiday plans.</p><form id="loginForm"><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><p id="message" role="alert"></p></main><script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.ok)location.href='/';else document.getElementById('message').textContent='Incorrect password';};</script></body></html>
